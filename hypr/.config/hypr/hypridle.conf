general {
    lock_cmd = pidof hyprlock || hyprlock --immediate-render
    before_sleep_cmd = pidof hyprlock || (hyprlock --immediate-render &); sleep 1
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}

# Suspend after 10 minutes on battery
listener {
    timeout = 600
    on-timeout = grep -q "Discharging" /sys/class/power_supply/BAT1/status && systemctl suspend
}

# Suspend after 30 minutes on AC (battery suspends at 10min, never reaches this)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}


